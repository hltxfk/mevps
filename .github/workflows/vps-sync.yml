# VPS 同步执行器：由 Cloudflare Worker 通过 repository_dispatch 触发。
# 安全约定：
#   - dispatch payload 只含 job_id/vps_id，不含任何凭据；
#   - SSH 凭据通过 HMAC 签名的内部接口临时取用，用完即弃，不落 GitHub Secrets/日志；
#   - 所有敏感值 ::add-mask:: 打码，避免泄漏进 Actions 日志。
name: VPS Sync · SSH 执行器

on:
  repository_dispatch:
    types: [vps-sync]

permissions:
  contents: read

concurrency:
  group: vps-sync-${{ github.event.client_payload.vps_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 安装 sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: SSH 采集配置 + 查询归属地并回传
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: |
          set -Eeuo pipefail
          : "${WORKER_URL:?请在 GitHub Secrets 配置 WORKER_URL}"
          : "${CALLBACK_SECRET:?请在 GitHub Secrets 配置 CALLBACK_SECRET}"
          : "${JOB_ID:?repository_dispatch 缺少 job_id}"
          # 归一化：去掉末尾斜杠，避免拼出 //api/xxx 导致路由 404
          WORKER_URL="$(printf '%s' "$WORKER_URL" | sed 's#/*$##')"

          hmac() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $NF}'; }
          post() {
            local path="$1" body="$2" sig
            sig=$(hmac "$body")
            curl -fsS -X POST "$WORKER_URL$path" \
              -H 'Content-Type: application/json' \
              -H "X-MEVPS-Signature: $sig" \
              -d "$body"
          }

          # ==== 失败兜底：成功/失败都必须回传结果 ====
          # 否则 Worker 侧 sync_jobs 停在 pending、vps.sync_status 停在 running，
          # 面板一直显示「同步中」，只能干等 15 分钟超时兜底。
          ONLINE=false
          ERR=""
          SPEC=""
          COUNTRY=""
          CITY=""
          IP=""
          GEO_EN=""
          GEO_ZH=""
          KEYFILE=""
          RESULT_POSTED=0

          # 幂等回传：RESULT_POSTED 保证不会重复上报。
          send_result() {
            if [ "$RESULT_POSTED" = 1 ]; then return 0; fi
            local body
            body=$(jq -nc \
              --arg job "$JOB_ID" \
              --arg country "$COUNTRY" \
              --arg city "$CITY" \
              --arg spec "$SPEC" \
              --arg err "$ERR" \
              --arg ip "$IP" \
              --arg geo_en "$GEO_EN" \
              --arg geo_zh "$GEO_ZH" \
              --argjson online "$ONLINE" \
              '{job_id:$job, country:$country, city:$city, spec:$spec, online:$online, ok:$online, error:$err, ip:$ip, geo_en:$geo_en, geo_zh:$geo_zh}')
            if post "/api/internal/result" "$body" >/dev/null; then
              RESULT_POSTED=1
              return 0
            fi
            return 1
          }

          # 任意命令失败都记下位置，别让 set -e 悄悄退出。
          # $BASH_COMMAND 是命令源码文本（变量引用不展开，形如 "$SECRET"），
          # 不会把密钥值带进错误信息；仍截断长度，避免写爆 sync_error 字段。
          on_err() {
            local code=$?
            if [ -z "$ERR" ]; then
              ERR="执行器失败：脚本第 $1 行 ${3:0:120}（exit=${code}）"
            fi
            ONLINE=false
          }
          trap 'on_err "$?" "$LINENO" "$BASH_COMMAND"' ERR

          # 退出时统一回传 + 清理临时密钥文件。
          # 全脚本只能有【一个】on EXIT 的 trap：再注册一个 cleanup 的 EXIT trap
          # 会把本 trap 整个覆盖掉。所以清理必须并进来。
          on_exit() {
            local code=$?
            trap - EXIT ERR
            set +e
            if [ -n "$KEYFILE" ]; then rm -f "$KEYFILE"; fi
            # 回传本身失败也要把 run 标红，别静默吞掉
            send_result || code=1
            exit "$code"
          }
          trap on_exit EXIT


          # 1) 取连接凭据（HMAC 鉴权，临时取用）
          cred_body=$(jq -nc --arg j "$JOB_ID" '{job_id:$j}')
          creds=$(post "/api/internal/creds" "$cred_body")
          HOST=$(jq -r '.data.host' <<<"$creds")
          PORT=$(jq -r '.data.port // 22' <<<"$creds")
          USER=$(jq -r '.data.username // "root"' <<<"$creds")
          AUTH=$(jq -r '.data.auth // "password"' <<<"$creds")
          SECRET=$(jq -r '.data.secret // ""' <<<"$creds")
          echo "::add-mask::$SECRET"
          echo "::add-mask::$HOST"

          KEYFILE=""
          cleanup() { [ -n "$KEYFILE" ] && rm -f "$KEYFILE"; }
          # 2) SSH 采集
          ONLINE=false
          ERR=""
          SPEC=""
          COUNTRY=""
          CITY=""

          SSH_BASE="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 -o LogLevel=ERROR -p $PORT"
          if [ "$AUTH" = "key" ]; then
            KEYFILE=$(mktemp)
            printf '%s\n' "$SECRET" > "$KEYFILE"
            chmod 600 "$KEYFILE"
          fi
          run_ssh() {
            if [ "$AUTH" = "key" ]; then
              ssh $SSH_BASE -i "$KEYFILE" "$USER@$HOST" "$@"
            else
              sshpass -p "$SECRET" ssh $SSH_BASE "$USER@$HOST" "$@"
            fi
          }

          # 远端采集脚本（base64 内嵌）。跨平台：Linux 用 free/nproc，

          # BSD/macOS 回退 sysctl，否则 FreeBSD 上内存会取空。

          # 远端采集脚本（base64 内嵌）。跨平台：Linux 用 free/nproc，

          # BSD/macOS 回退 sysctl，否则 FreeBSD 上内存会取空。

          echo '' | base64 -d > /tmp/collect.sh
          if OUT=$(run_ssh 'bash -s' < /tmp/collect.sh 2>/tmp/ssh_err); then
            ONLINE=true
            os=$(awk -F= '/^OS=/{sub(/^OS=/,"");print}' <<<"$OUT" | tail -1)
            cpu=$(awk -F= '/^CPU=/{print $2}' <<<"$OUT" | tail -1)
            mem=$(awk -F= '/^MEM=/{print $2}' <<<"$OUT" | tail -1)
            disk=$(awk -F= '/^DISK=/{print $2}' <<<"$OUT" | tail -1)
            SPEC="${cpu} / ${mem} / ${disk} / ${os}"
            SPEC=$(printf '%s' "$SPEC" | cut -c1-300)
          else
            ERR=$(head -c 200 /tmp/ssh_err 2>/dev/null | tr '\n' ' ')
            ERR=${ERR:-SSH 连接失败}
          fi

          # 3) 归属地（国家 / 州省 / 市）+ 解析出的 IP
          # 中英各查一次：ip-api 的 lang=zh-CN 只翻译部分字段（市常常仍是英文），
          # 取不到就落回英文。IP 用 getent 从 DNS 解析；与填写的「主机 / IP」一致时
          # 前端只显示一个，否则显示 ip + (域名)。
          IP=$(getent ahostsv4 "$HOST" 2>/dev/null | awk '{print $1; exit}')
          IP=${IP:-$HOST}
          if [ "$ONLINE" = "true" ] || [ -n "$HOST" ]; then
            GEO=$(curl -fsS "http://ip-api.com/json/${HOST}?fields=status,country,regionName,city" 2>/dev/null || echo '{}')
            GEO_Z=$(curl -fsS "http://ip-api.com/json/${HOST}?fields=status,country,regionName,city&lang=zh-CN" 2>/dev/null || echo '{}')
            geo3() { jq -r '[.country, .regionName, .city] | map(select(type=="string" and length>0)) | join(" · ")' <<<"$1"; }
            COUNTRY=$(jq -r '.country // ""' <<<"$GEO")
            CITY=$(jq -r '[.city, .regionName] | map(select(. != null and . != "")) | join(" ")' <<<"$GEO")
            GEO_EN=$(geo3 "$GEO")
            GEO_ZH=$(geo3 "$GEO_Z")
          fi

          # 4) 回传结果（HMAC 鉴权）——成功失败都回传，见 send_result / trap on_exit
          send_result
          echo "同步完成 online=$ONLINE ip=$IP geo=$GEO_EN / $GEO_ZH"
