    <script>
      // 首屏预判：本地已有登录态则直接标记 authed，避免刷新时先闪登录框再进后台
      try {
        if (localStorage.getItem('mevps_token')) document.documentElement.classList.add('authed');
      } catch (e) {}
    </script>

        </label>
        <label class="field">
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" id="login-password" name="password" type="password" placeholder="密码" autocomplete="current-password" required />

        </label>
        <div class="login-row">
          <label class="checkbox"><input id="login-remember" type="checkbox" checked /><span>记住我</span></label>
          <a class="link" href="javascript:void(0)" onclick="return false">忘记密码？</a>

            <i class="social" title="QQ"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 3c-3.6 0-6 2.5-6 5.9 0 1.4.5 2.7 1.3 3.7-.4.9-.9 2-1.2 2.8-.2.6.3 1 .8.7.9-.5 1.8-1 2.4-1.4.8.2 1.7.3 2.7.3s1.9-.1 2.7-.3c.6.4 1.5.9 2.4 1.4.5.3 1-.1.8-.7-.3-.8-.8-1.9-1.2-2.8.8-1 1.3-2.3 1.3-3.7C18 5.5 15.6 3 12 3zm-2.2 4.6a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zm4.4 0a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2zM8.5 16.8c.5 2.2 2 3.7 3.5 3.7s3-1.5 3.5-3.7c-.5.1-1.1.2-1.7.2h-3.6c-.6 0-1.2-.1-1.7-.2z"/></svg></i>

        </div>
      </form>

        <button type="button" class="quick-btn" data-role="超级管理员">超级管理员</button>

        <button type="button" class="quick-btn" data-role="普通用户">普通用户</button>
